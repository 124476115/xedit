name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: code-editor
            artifact: code-editor
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: code-editor.exe
            artifact: code-editor.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: code-editor
            artifact: code-editor
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: code-editor
            artifact: code-editor-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxext-dev \
            libgtk-3-dev libasound2-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# Build failed on ${{ matrix.os }} (${{ matrix.target }})"
            echo '```'
            tail -n 100 build.log
            echo '```'
          } | gh issue create --title "Build failed ${{ matrix.os }} $(date +%s)" --body-file -

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package
        run: |
          cd dist
          for f in */*; do
            base=$(basename "$f")
            mv "$f" "${base%%-*}-${{ github.ref_name }}-${f%/*}"
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true